name: Scheduled recall ingestion

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pipeline
        run: python -m pip install .
      - name: Ingest latest vehicle years
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is not set; skipping scheduled ingestion. Configure it to enable this workflow."
            exit 0
          fi
          current_year=$(date -u +%Y)
          start_year=$((current_year - 3))
          python -m recallops.cli --start-year "$start_year" --end-year "$current_year"
